# Miglore OS — Prometheus 配置 (开发环境)
# 仅监控容器网络内服务; 不采集宿主机指标 (node exporter 本阶段不做)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Miglore OS Backend (prometheus-client /metrics)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5001"]
