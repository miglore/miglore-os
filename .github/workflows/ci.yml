# Miglore OS CI — 测试 + 构建 (不自动部署)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: miglore_os_test
          MYSQL_USER: miglore_os
          MYSQL_PASSWORD: test_app_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_pass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Run tests (独立测试库 miglore_os_test)
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_USER: miglore_os
          DATABASE_PASSWORD: test_app_pass
          DATABASE_NAME: miglore_os_test
        run: |
          cd backend
          pytest -v

  frontend:
    name: Frontend check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: cd frontend && npm ci --registry=https://registry.npmmirror.com
      - name: svelte-check
        run: cd frontend && npm run check
      - name: Build
        run: cd frontend && npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t miglore-os-backend ./backend
      - name: Build frontend image
        run: docker build -t miglore-os-frontend ./frontend
